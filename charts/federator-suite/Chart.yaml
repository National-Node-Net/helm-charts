apiVersion: v2
name: federator-suite
description: Helm chart for Federator application suite (client, server, kafka, valkey, vault, certificate-manager, UIs)
type: application
version: 0.2.3
appVersion: "0.4.1"
home: https://github.com/national-node-net/helm-charts
maintainers:
  - name: National Digital Twin Programme
    email: contact@ndtp.gov.uk

dependencies:
  # Kafka is provided as default by the Strimzi operator and does not require a Helm chart dependency.
  - name: valkey
    version: "0.1.0"
    repository: "file://charts/valkey"
    condition: valkey.enabled
  - name: vault
    version: "0.1.0"
    repository: "file://charts/vault"
    condition: vault.enabled

