# Kafka Configuration
# if we have external Kafka, set external to true and provide the necessary configuration
kafka:
  external: true
  internalSettings:
    config:  # if this is provided it will be used as Kafka's configuration
      offsets.topic.replication.factor: 1
      transaction.state.log.replication.factor: 1
      transaction.state.log.min.isr: 1
      default.replication.factor: 1
      min.insync.replicas: 1
      auto.create.topics.enable: true
  externalSettings:
    bootstrapServers: "aws-msk-kafka-for-example"
    securityProtocol: "SASL_SSL"
    saslMechanism: "SCRAM-SHA-512"  # todo for IAM, AWS)MSK_IAM and sasl.client.callback.handler.class=software.amazon.msk.auth.iam.IAMClientCallbackHandler
