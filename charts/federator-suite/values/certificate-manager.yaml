# ============================================================================
# Certificate Manager Component Values
# ============================================================================


certificateManager:
  enabled: true

  # ── Replica Configuration ───────────────────────────────────────────────────
  # Certificate manager is a singleton scheduler — keep at 1
  replicaCount: 1

  # ── Image Configuration ─────────────────────────────────────────────────────
  image:
    # PLACEHOLDER: Set to your container registry
    repository: "PLACEHOLDER_REGISTRY/federator-certificate-manager"
    # PLACEHOLDER: Set to the latest image tag
    tag: "PLACEHOLDER_IMAGE_TAG"
    pullPolicy: IfNotPresent

  imagePullSecrets: []

  # ── Service Account ─────────────────────────────────────────────────────────
  serviceAccount:
    create: true
    name: ""  # Defaults to <release>-certificate-manager via helper
    annotations: {}

  # ── Pod Configuration ───────────────────────────────────────────────────────
  podAnnotations: {}

  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    fsGroup: 1000

  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false  # Needs to write certs to /certs
    capabilities:
      drop: ["ALL"]

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  # ── Persistence (shared PVC for cert storage) ──────────────────────────────
  persistence:
    accessMode: ReadWriteMany
    size: 1Gi
    storageClass: ""  # Uses default StorageClass; set to "efs-sc" for AWS EFS

  # ── Bootstrap Certificate ──────────────────────────────────────────────────
  bootstrapCert:
    enabled: false
    secretName: ""  # Name of pre-created Secret containing bootstrap PKCS12

  # ── Application Configuration ──────────────────────────────────────────────
  config:
    appLogLevel: INFO
    springSecurityLogLevel: INFO

    # Vault settings
    vault:
      pkiMount: node-net

      secretPath: "node-net/client"
      # authentication: TOKEN for Shamir/local (reads VAULT_TOKEN), KUBERNETES for cloud k8s auth
      authentication: KUBERNETES
      authRole: certificate-manager

    # Management Node connectivity
    managementNode:
      # PLACEHOLDER: Override per environment
      baseUrl: ""  # Falls back to global.managementNode.baseUrl if empty

    # OAuth2 configuration for Management Node API — always required by the app
    # (application.yml has no enable/disable toggle; leaving these empty makes the app
    # silently fall back to its dev-placeholder https://localhost:8443/... URL).
    oauth2:
      # PLACEHOLDER: Set per environment — chart render fails if left empty
      tokenUri: ""
      clientId: ""

    # Certificate generation settings — property names/env vars per
    # federator-certificate-manager's application.yml (application.certificate.*)
    cert:
      destPath: /certs                       # CERT_DEST_PATH — matches the mounted cert-storage PVC path
      renewalRate: "3600000"                  # CERT_RENEWAL_RATE (ms) — how often renewal is checked
      syncRate: "60000"                       # CERT_SYNC_RATE (ms) — how often Vault is synced to disk
      renewalThresholdPercentage: "10"        # CERT_RENEWAL_THRESHOLD
      keySize: "2048"                         # CERT_KEY_SIZE
      intermediateMinValidDays: "14"          # CERT_INTERMEDIATE_MIN_VALID_DAYS
      destKeystoreAlias: "federator"          # CERT_DEST_KEYSTORE_ALIAS
      # PLACEHOLDER: Set per environment
      subjectOrg: ""
      subjectCountry: ""
      subjectState: ""
      subjectLocality: ""
      subjectOu: ""
      # PLACEHOLDER: Required — app defaults to the ACME-placeholder "api.acme-digital.co.uk"
      # if unset, which is meaningless for any real org. Chart render fails if left empty.
      subjectCn: ""
      # PLACEHOLDER: Required, comma-separated DNS SANs. Same rationale as subjectCn above.
      subjectAltNames: ""

    # mTLS client identity used to call the IdP and Management Node
    # (application.client.* / MtlsHttpClientBuilder).
    # Verified against federator-certificate-manager source + README ("Local Development
    # with Management Node"): the mTLS identity IS the cert-manager's OWN output
    # keystore.p12 / truststore.p12 that CertificateSyncJob writes into cert.destPath from
    # the material stored in Vault. MtlsHttpClientBuilder resolves the store passwords from
    # Vault (keystore-password / truststore-password, generated by the sync job) BEFORE
    # falling back to MTLS_*_PASSWORD, so mounting a different operator-provisioned JKS with
    # a static password (the previous approach) breaks as soon as the sync job has run once.
    # Bootstrap (chicken-and-egg): an operator seeds Vault at <secretPath>/{keypair,
    # certificate, ca-chain} with a short-lived bootstrap cert from Management Node
    # (POST /api/v1/certificate/bootstrap); the sync job then materialises the PKCS12 files
    # and the renewal job uses them to obtain the first long-lived cert.
    mtls:
      keystorePath: ""                # default: <cert.destPath>/<cert.destKeystoreFile>
      truststorePath: ""              # default: <cert.destPath>/<cert.destTruststoreFile>
      keystoreType: PKCS12            # applies to BOTH stores in MtlsHttpClientBuilder; sync job writes PKCS12


  # ── Vault Token (TOKEN auth mode only) ──────────────────────────────────────
  # Used when config.vault.authentication=TOKEN (local/dev without k8s auth).
  # The init container blocks startup until the secret exists, preventing
  # Spring Cloud Vault failing with "spring.cloud.vault.token is empty".
  vaultToken:
    # Set true when using TOKEN auth — injects VAULT_TOKEN from a pre-existing k8s Secret
    useSecret: false
    # In local mode, this secret is created by the vault-setup sidecar on vault-0

  # ── Scheduling ──────────────────────────────────────────────────────────────
  nodeSelector: {}
  tolerations: []
  affinity: {}
