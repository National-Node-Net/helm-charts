# Valkey configuration. Set external=true to use a managed Valkey/Redis
# service; otherwise the official Valkey Helm chart is deployed in-cluster.
valkey:
  enabled: true # Disable if using external Valkey.
  external: false # Set true when using external Valkey.
  externalSettings:
    host: "example.msk.cache.amazonaws.com"
    port: 6379
    tlsEnabled: true
    externalSecret:
      ## provide the necessary authentication details for the external Valkey/Redis
      name: xxxx
      usernameField: "myUsername" # maps to VALKEY_USERNAME
      passwordField: "myPassword" # maps to VALKEY_PASSWORD      
  valkey:
    # provide the necessary configuration for the local Valkey deployment
    service:
      port: 6379
    replica:
      enabled: true
      replicas: 2
      replicationUser: default
      minReplicasToWrite: 1
      minReplicasMaxLag: 10
      persistence:
        # storageClass:   dont set this if you want to use the default storage class
        size: 1Gi
        accessModes:
          - ReadWriteOnce
      persistentVolumeClaimRetentionPolicy:
        whenDeleted: Retain
        whenScaled: Retain
  ui:
    enabled: true
    image:
      repository: redis/redisinsight
      tag: "3.8.0"
    service:
      type: NodePort
      nodePort: 30091  # Access via http://localhost:30091 (mapped in Kind)
