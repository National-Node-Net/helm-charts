# Valkey configuration. Set external=true to use a managed Valkey/Redis
# service; otherwise the official Valkey Helm chart is deployed in-cluster.
valkey:
  # controls the local Valkey wrapper. Set this to false with external=true.
  enabled: false  
  external: false
  externalSettings:
    host: "clustercfg.dev-valkey-cluster.kquwra.euw2.cache.amazonaws.com"
    port: 6379
    tlsEnabled: true
    ## provide the necessary authentication details for the external Valkey/Redis instance in the federator-suite:runtimeSecret: federator-runtime-properties
  valkey:
    # provide the necessary configuration for the local Valkey deployment
    replica:
      enabled: true
      replicas: 2
      replicationUser: default
      minReplicasToWrite: 1
      minReplicasMaxLag: 10
      persistence:
        storageClass: auto-ebs-sc2
        size: 1Gi
        accessModes:
          - ReadWriteOnce
      persistentVolumeClaimRetentionPolicy:
        whenDeleted: Retain
        whenScaled: Retain