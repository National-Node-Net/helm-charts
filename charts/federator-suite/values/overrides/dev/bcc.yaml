# BCC Dev Environment Configuration (AWS EKS)
# Self-contained: AWS-specific + BCC-specific configuration
# Usage: helm install bcc . -f values/common-values.yaml -f values/kafka.yaml -f values/valkey.yaml -f values/federator.yaml -f values/overrides/dev/bcc.yaml -f values/overrides/dev/secrets/bcc-secrets.yaml

global:
  environment: dev
  clusterType: eks
  orgName: bcc
  orgPrefix: bcc
  namespace: helm-federator-suite-bcc # Namespace must already exist in EKS cluster.
# These Secrets are created and refreshed by Vault Secrets Operator. Do not let
# the chart render its placeholder Secret values.
secrets:
  create: false

# Kafka Configuration
kafka:
  external: true
  internalSettings:
    config:  # if this is provided it will be used as Kafka's configuration
      offsets.topic.replication.factor: 1
      transaction.state.log.replication.factor: 1
      transaction.state.log.min.isr: 1
      default.replication.factor: 1
      min.insync.replicas: 1
      auto.create.topics.enable: true
  externalSettings:
    bootstrapServers: "aws-msk-kafka-for-example"
    securityProtocol: "SASL_SSL"
    saslMechanism: "SCRAM-SHA-512"  # todo for IAM, AWS)MSK_IAM and sasl.client.callback.handler.class=software.amazon.msk.auth.iam.IAMClientCallbackHandler
  ui:
    enabled: true
    service:
      type: ClusterIP
    image:
      repository: provectuslabs/kafka-ui
      tag: latest
      pullPolicy: IfNotPresent

# In-cluster Bitnami Valkey
valkey:
  external: false
  enabled: true  # Enable in-cluster Bitnami Valkey

# Federator Server - AWS Dev
federatorServer:
  runtimeSecret: federator-runtime-properties
  image:
    repository: 537124944113.dkr.ecr.eu-west-2.amazonaws.com/ndtp/ia-federator-server # {"$imagepolicy": "flux-system:federator-suite-server-image-policy:name"}
    tag: "1.2.0-20261021141726" # {"$imagepolicy": "flux-system:federator-suite-server-image-policy:tag"}
    pullPolicy: IfNotPresent
  
  replicaCount: 1
  
  serviceAccount:
    annotations:
      eks.amazonaws.com/role-arn: "arn:aws:iam::537124944113:role/federator-access-role"
  
  
  resources:
    requests:
      cpu: 512m
      memory: 1Gi
    limits:
      cpu: 512m
      memory: 1Gi
  
  service:
    type: ClusterIP
  
  # BCC-specific configuration
  config:
    clientName: "ndtp.dbt.gov.uk.bcc"
    redisPrefix: "federator-server-bcc"
    keepAliveTime: 10
    mtlsEnabled: true
    storage:
      provider: "S3"
      s3:
        bucket: "537124944113-federator-orgid2-bcc"
        region: "eu-west-2"

# Federator Client - AWS Dev
federatorClient:
  runtimeSecret: federator-runtime-properties
  image:
    repository: 537124944113.dkr.ecr.eu-west-2.amazonaws.com/ndtp/ia-federator-client # {"$imagepolicy": "flux-system:federator-suite-client-image-policy:name"}
    tag: "1.2.0-20261021141726" # {"$imagepolicy": "flux-system:federator-suite-client-image-policy:tag"}
    pullPolicy: IfNotPresent
  
  replicaCount: 1
  
  serviceAccount:
    annotations:
      eks.amazonaws.com/role-arn: "arn:aws:iam::537124944113:role/federator-access-role"
  
  
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 250m
      memory: 512Mi
  
  service:
    type: ClusterIP
  
  # BCC-specific configuration
  config:
    kafkaTopicPrefix: "DeprecatedBCC"
    kafkaConsumerGroup: "ndtp.dbt.gov.uk.bcc"
    redisPrefix: "federator-client-bcc"
    mtlsEnabled: true
    tlsEnabled: true
    storage:
      provider: "S3"
      s3:
        bucket: "537124944113-federator-orgid2-bcc"
        region: "eu-west-2"
  
  # Override client-specific env for BCC
  env:
    IDP_KEYSTORE_PATH: /secrets/federation-cert/client-org1-keystore.jks
    CLIENT_P12_FILE_PATH: /secrets/federation-client-p12/client-org1.p12

valkeyUi:
  enabled: true
  image:
    repository: redis/redisinsight
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    annotations: {}

# Istio configuration for EKS
# Enabled to match ia-federation namespace configuration
serviceMesh:
  istio:
    enabled: true
    gateway:
      name: ia-federator-ingress-gateway
      selector:
        app: istio-ingress-passthrough
      hosts:
        - "helm-ia-federator-org1-aws.dev.ndtp.co.uk"
    virtualService:
      name: federator-org1-vs
      hosts:
        - "helm-ia-federator-org1-aws.dev.ndtp.co.uk"
      gatewayRefs:
        - ia-federator-ingress-gateway
    destinationRule:
      name: federator-server-org1-dr
    peerAuthentication:
      mode: STRICT
    authorizationPolicy:
      denyByDefault: false
      allowedServiceAccounts:
        - cluster.local/ns/istio-ingress/sa/istio-ingress
      allowedNamespaces:
        - helm-ia-federation
        - ia-federation
        - ia-federation-org2
        - istio-ingress
        - ia-management-node

# Management Node - AWS Dev
managementNode:
  baseUrl: "https://ia-management-node.dev.ndtp.co.uk"

# Vault + Certificate Manager (AWS EKS)
vault:
  # The packaged chart's defaults are for local development. BCC uses AWS KMS
  # auto-unseal, so the setup sidecar must request recovery keys, not Shamir
  # unseal shares.
  cloudProvider: aws
  devMode: false
  seal:
    aws:
      region: eu-west-2
      kmsKeyId: "a95fad0c-6728-43ad-a0f5-a6076ca21acb"
  serviceAccount:
    # The nested Vault chart creates and uses <release>-vault. The parent
    # chart account (<release>-vault-sa) is otherwise unused.
    create: false
    annotations:
      eks.amazonaws.com/role-arn: "arn:aws:iam::537124944113:role/federator-suite-bcc-vault-unseal-role"
  secretsManager:
    # A dedicated secret is required: the setup sidecar writes Vault bootstrap
    # material here and must not share it with another Vault installation.
    secretName: "federator-suite-bcc-vault-secrets"
  staticSecrets:
    enabled: true
  vault:
    server:
      serviceAccount:
        annotations:
          eks.amazonaws.com/role-arn: "arn:aws:iam::537124944113:role/federator-suite-bcc-vault-unseal-role"
      # Required when serviceMesh.istio.enabled: Istio STRICT mTLS otherwise
      # blocks the raft/unseal listener (NR filter_chain_not_found)
      annotations:
        traffic.sidecar.istio.io/excludeInboundPorts: "8200,8201"
        traffic.sidecar.istio.io/excludeOutboundPorts: "8200,8201"
      ha:
        raft:
          config: |
            ui = true

            listener "tcp" {
              tls_disable = 1
              address     = "[::]:8200"
              cluster_address = "[::]:8201"
            }

            storage "raft" {
              path = "/vault/data"
            }

            seal "awskms" {
              region     = "eu-west-2"
              kms_key_id = "a95fad0c-6728-43ad-a0f5-a6076ca21acb"
            }

            service_registration "kubernetes" {}

certificateManager:
  enabled: false
  persistence:
    accessMode: ReadWriteOnce
  image:
    repository: "537124944113.dkr.ecr.eu-west-2.amazonaws.com/ndtp/federator-certificate-manager"
    tag: "1.0.0"
  config:
    managementNode:
      baseUrl: "https://ia-management-node.dev.ndtp.co.uk"
    oauth2:
      enabled: true
      tokenUri: "https://ia-idp.dev.ndtp.co.uk/realms/mng-node/protocol/openid-connect/token"
      clientId: "FEDERATOR_BCC"
    cert:
      subjectOrg: "bcc"
      subjectCountry: "GB"

# BCC-specific secrets (defined in secrets/bcc-secrets.yaml)
