# Local Kind Deployment Configuration
# Usage: helm install federator-suite . -f values.yaml -f values-local.yaml -f values-secrets.yaml

global:
  environment: local
  clusterType: kind

# Runtime certificates and application settings are bootstrapped into Vault
# from values/overrides/local/<org>.secrets.json, then rendered by VaultStaticSecret.
secrets:
  create: false

# Use in-cluster Strimzi Kafka for local
kafka:
  external: false
  ui:
    enabled: true
    service:
      type: NodePort
      nodePort: 30090  # Access via http://localhost:9090
    image:
      repository: provectuslabs/kafka-ui
      tag: latest
      pullPolicy: IfNotPresent

# Use in-cluster Valkey for local
valkey:
  external: false
  enabled: true
  ui:
    enabled: true
    service:
      nodePort: 30091  # Access via localhost:9091
  valkey:
    # Override the EKS-oriented base configuration for a one-node KIND cluster.
    replica:
      enabled: true
      replicas: 0
      # A single-node local Valkey has no replicas. Do not reject writes while
      # waiting for the production replica quorum.
      minReplicasToWrite: 0
      persistence:
        storageClass: standard
        size: 1Gi
        accessModes:
          - ReadWriteOnce
    podDisruptionBudget:
      enabled: false
    topologySpreadConstraints: []


# Federator Server - Local Configuration
federatorServer:
  imagePullSecrets:
    - name: image-pull-creds
  image:
    repository: 537124944113.dkr.ecr.eu-west-2.amazonaws.com/ndtp/ia-federator-server
    tag: "1.2.0-20261104101759"
    pullPolicy: IfNotPresent
  replicaCount: 1
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 512Mi
  serviceAccount:
    create: true
    annotations: {}
  service:
    type: NodePort
    port: 8080
    nodePort: 30080  # Access via localhost:8080
  config:
    serverPort: 8080


# Federator Client - Local Configuration
federatorClient:
  imagePullSecrets:
    - name: image-pull-creds
  image:
    repository: 537124944113.dkr.ecr.eu-west-2.amazonaws.com/ndtp/ia-federator-client
    tag: "1.2.0-20261104101759"
    pullPolicy: IfNotPresent
  replicaCount: 1
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi
  serviceAccount:
    create: true
    annotations: {}
  service:
    type: NodePort
    port: 8081
    nodePort: 30081  # Access via localhost:8081
  config:
    serverPort: 8081

# Enable UIs for local development
# Istio disabled for local
serviceMesh:
  istio:
    enabled: false

# Certificate Manager — Local
certificateManager:
  imagePullSecrets:
    - name: image-pull-creds
  image:
    repository: 537124944113.dkr.ecr.eu-west-2.amazonaws.com/ndtp/ia-federator-certificate-manager
    tag: "0.90.0-20261023084513"
    pullPolicy: IfNotPresent
  persistence:
    # KIND local-path provisioner only supports ReadWriteOnce (not ReadWriteMany)
    accessMode: ReadWriteOnce
  vaultToken:
    # Init container blocks until vault-setup sidecar creates token secret
    useSecret: true
  config:
    vault:
      # Override default KUBERNETES → TOKEN for local Shamir-seal Vault
      # Corresponds to application.yml: authentication: ${VAULT_AUTHENTICATION:token}
      authentication: TOKEN

# Management Node - Local
managementNode:
  baseUrl: "http://localhost:8082"  # Adjust if management node is also local

# ── Vault — Local (KIND) Configuration ──────────────────────────────────────
# Uses Shamir seal (no cloud KMS), single replica, stores credentials in k8s Secret
vault:
  devMode: true

  secretsManager:
    secretName: federator-suite-vault-credentials

  staticSecrets:
    enabled: true

  ha:
    replicas: 1

  vault:
    server:
      ha:
        enabled: false
        replicas: 1
        raft:
          enabled: true
          config: |
            ui = true

            listener "tcp" {
              tls_disable = 1
              address     = "[::]:8200"
              cluster_address = "[::]:8201"
            }

            storage "raft" {
              path = "/vault/data"
            }

            # No seal stanza — uses Shamir seal for local development
            service_registration "kubernetes" {}
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 250m
          memory: 256Mi
      dataStorage:
        enabled: true
        size: 1Gi
        storageClass: standard
      auditStorage:
        enabled: true
        size: 1Gi
        storageClass: standard

# OPA — Local (KIND): single replica is enough for a functional smoke test
opa:
  replicaCount: 1
