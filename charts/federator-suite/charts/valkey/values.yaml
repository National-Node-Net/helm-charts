# Local wrapper for the official Valkey Helm chart.
# The parent chart controls this with `valkey.enabled`.
enabled: false

valkey:
  # Valkey 0.12.1: replicated deployment (one primary and two replicas).
  # This chart version does not provide Sentinel or HAProxy.
  auth:
    enabled: true
    usersExistingSecret: valkey-secrets
    aclUsers:
      default:
        permissions: "~* &* +@all"
        passwordKey: valkey_password

  replica:
    enabled: true
    replicas: 2
    replicationUser: default
    minReplicasToWrite: 1
    minReplicasMaxLag: 10
    persistence:
      storageClass: auto-ebs-sc2
      size: 1Gi
      accessModes:
        - ReadWriteOnce
    persistentVolumeClaimRetentionPolicy:
      whenDeleted: Retain
      whenScaled: Retain

  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 1Gi

  podLabels:
    workload: valkey-data

  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          workload: valkey-data
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: DoNotSchedule
      labelSelector:
        matchLabels:
          workload: valkey-data

  podDisruptionBudget:
    enabled: true
    minAvailable: 2

  service:
    type: ClusterIP
    port: 6379

  metrics:
    enabled: false # at this time turn off metrics
    serviceMonitor:
      enabled: false

  tls:
    enabled: false

