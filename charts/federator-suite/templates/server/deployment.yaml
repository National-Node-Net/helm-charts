{{- if .Values.federatorServer.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "server.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{ include "federator-suite.server.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.federatorServer.replicaCount }}
  {{- with .Values.federatorServer.strategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  revisionHistoryLimit: {{ .Values.federatorServer.revisionHistoryLimit | default 3 }}
  selector:
    matchLabels:
      {{ include "federator-suite.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmaps/server-properties.yaml") . | sha256sum }}
        {{- include "federator-suite.istio.inject" . | nindent 8 }}
        {{- with .Values.federatorServer.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{ include "federator-suite.server.labels" . | nindent 8 }}
        {{- if eq .Values.global.clusterType "aks" }}
        azure.workload.identity/use: "true"
        {{- end }}
    spec:
      serviceAccountName: {{ include "server.serviceAccountName" . }}
      restartPolicy: Always
      {{- with .Values.federatorServer.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.federatorServer.podSecurityContext | nindent 8 }}
      containers:
      - name: federator-server
        image: "{{ .Values.federatorServer.image.repository }}:{{ .Values.federatorServer.image.tag }}"
        imagePullPolicy: {{ .Values.federatorServer.image.pullPolicy | default "IfNotPresent" }}
        ports:
        - name: http
          containerPort: {{ .Values.federatorServer.config.serverPort }}
          protocol: TCP
        - name: jobs-dashboard
          containerPort: {{ .Values.federatorServer.config.jobsDashboardPort }}
          protocol: TCP
        env:
        - name: FEDERATOR_SERVER_PROPERTIES
          value: /config/server.properties
        # Passwords for the certificate-manager-generated PKCS#12 runtime bundle.
        - name: RUNTIME_KEYSTORE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: federator-runtime-certificates
              key: keystore.password
        - name: RUNTIME_TRUSTSTORE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: federator-runtime-certificates
              key: truststore.password

        # use the configured secret for external or bundled kafka.
        - name: KAFKA_SASL_JAAS_CONFIG
          valueFrom:
            secretKeyRef:
            {{- if .Values.kafka.external }}
              name: {{ .Values.kafka.externalSettings.externalSecret.name }}
              key: {{ .Values.kafka.externalSettings.externalSecret.saslJaasConfig }}
            {{- else }}
              # use the secret created by strimzi for bundled kafka.
              # if we are using the bundled  strimzi Kafka, we need to set the KAFKA_SASL_JAAS_CONFIG environment 
              # from the kafka-user secret that strimzi creates    
              name: kafka-user
              key: sasl.jaas.config
            {{- end }}

        {{- include "storage,auth" . | nindent 8 }}

        {{- if .Values.valkey.external }}
        # use the user-provided external valkey secret.
        - name: VALKEY_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Values.valkey.externalSettings.externalSecret.name }}
              key: {{ .Values.valkey.externalSettings.externalSecret.passwordField }}
        - name: VALKEY_USERNAME
          valueFrom:
            secretKeyRef:
              name: {{ .Values.valkey.externalSettings.externalSecret.name }}
              key: {{ .Values.valkey.externalSettings.externalSecret.usernameField }}
        {{- else }}
        # if we are using the bundled valkey we need to set the VALKEY_* environment variables from the valkey secret
        # this is automatically injected from the valkey secret which is created by the valkey VaultStaticSecret
        - name: VALKEY_PASSWORD
          valueFrom:
            secretKeyRef:
              name: valkey-secrets
              key: valkey_password
        - name: VALKEY_USERNAME
          valueFrom:
            secretKeyRef:
              name: valkey-secrets
              key: valkey_username
        {{- end }}
        
        # TCP socket probes verify that the server process is listening on the app port.
        # This is used because the server exposes gRPC rather than a simple HTTP health endpoint.
        livenessProbe:
          tcpSocket:
            port: http
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          tcpSocket:
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          {{- toYaml .Values.federatorServer.resources | nindent 10 }}
        volumeMounts:
        - name: config-volume
          mountPath: /config
        - name: server-properties-volume
          mountPath: /config-templates/server.properties # if a config appears here, the entrypoint in the server will transform and copy to /config
          subPath: server.properties
          readOnly: true
        - name: runtime-certificates
          mountPath: /secrets/federator-runtime-certificates
          readOnly: true
        {{- include "storage.auth.volumeMounts" . | nindent 8 }}
        securityContext:
          {{- toYaml .Values.federatorServer.securityContext | nindent 10 }}
      volumes:
      - name: config-volume
        emptyDir: {}
      - name: server-properties-volume
        configMap:
          name: {{ include "server.name" . }}-properties
      - name: runtime-certificates
        secret:
          secretName: federator-runtime-certificates
      {{- include "storage.auth.volumes" . | nindent 6 }}
      {{- with .Values.federatorServer.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.federatorServer.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.federatorServer.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
