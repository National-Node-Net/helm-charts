{{- if .Values.valkey.ui.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "valkeyui.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: valkey-ui
    {{ include "federator-suite.labels" . | nindent 4 }}
spec:
  replicas: 1
  {{- with .Values.valkey.ui.strategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- else }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  {{- end }}
  selector:
    matchLabels:
      app: valkey-ui
  template:
    metadata:
      labels:
        app: valkey-ui
      annotations:
    spec:
      restartPolicy: Always
      containers:
      - name: valkey-ui
        image: "{{ .Values.valkey.ui.image.repository }}:{{ .Values.valkey.ui.image.tag }}"
        imagePullPolicy: {{ .Values.valkey.ui.image.pullPolicy | default "IfNotPresent" }}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsNonRoot: true
        ports:
        - name: http
          containerPort: 5540
          protocol: TCP
        env:
        # RedisInsight preconfigured database connection
        - name: RI_REDIS_HOST
          value: "{{ include "valkey.hostname" . }}"

      {{- if not .Values.valkey.external }}
        # Internal Redis settings
        - name: RI_REDIS_ALIAS
          value: "InternalValkey"
        - name: RI_REDIS_PORT
          value: "{{ .Values.valkey.valkey.service.port }}"
        - name: RI_REDIS_TLS
          value: "false" # not using TLS for internal Redis as istio is handling mTLS
        - name: RI_REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: valkey-secrets
              key: valkey_password
        - name: RI_REDIS_USERNAME
          valueFrom:
            secretKeyRef:
              name: valkey-secrets
              key: valkey_username
        {{- else }}
        # External Redis settings
        - name: RI_REDIS_ALIAS
          value: "ExternalValkey"
        - name: RI_REDIS_PORT
          value: "{{ .Values.valkey.externalSettings.port }}"
        - name: RI_REDIS_TLS
          value: "{{ .Values.valkey.externalSettings.tlsEnabled | default false }}"
        - name: RI_REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: federator-runtime-properties
              key: VALKEY_PASSWORD
        - name: RI_REDIS_USERNAME
          valueFrom:
            secretKeyRef:
              name: federator-runtime-properties
              key: VALKEY_USERNAME
        {{- end }}
        resources:
          {{- if .Values.valkey.ui.resources }}
          {{- toYaml .Values.valkey.ui.resources | nindent 10 }}
        {{- else }}
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 100m
            memory: 128Mi
        {{- end }}
{{- end }}
