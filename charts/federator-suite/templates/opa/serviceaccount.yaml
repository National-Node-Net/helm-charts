{{- if and .Values.opa.enabled .Values.opa.serviceAccount.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "federator-suite.opa.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{ include "federator-suite.labels" . | nindent 4 }}
    app.kubernetes.io/component: opa
  {{- with .Values.opa.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# Never calls the k8s API — policy is loaded from a local ConfigMap, so no
# token/RBAC is needed 
automountServiceAccountToken: false
{{- end }}
