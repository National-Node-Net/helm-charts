{{- if and .Values.vault.staticSecrets.enabled (not .Values.valkey.external) }}

apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: federator-suite-valkey-auth
  namespace: {{ .Release.Namespace }}
spec:
  vaultAuthRef: federator-suite-vault-internal
  mount: secret
  path: /apps/valkey
  type: kv-v2
  refreshAfter: 30s
  # Restart Valkey when the credentials are refreshed.
  rolloutRestartTargets:
    - kind: StatefulSet
      name: {{ .Release.Name }}-valkey
  destination:
    name: valkey-secrets
    create: true
    overwrite: true
    # Export only the keys expected by the bundled Valkey chart and consumers.
    transformation:
      excludeRaw: true
      excludes:
        - '.*'
      templates:
        valkey_password:
          text: {{ "{{ get .Secrets \"valkey_password\" }}" | quote }}
        valkey_username:
          text: {{ "{{ get .Secrets \"valkey_username\" }}" | quote }}
        sentinel_username:
          text: {{ "{{ get .Secrets \"sentinel_username\" }}" | quote }}
        sentinel_password:
          text: {{ "{{ get .Secrets \"sentinel_password\" }}" | quote }}
{{- end }}
