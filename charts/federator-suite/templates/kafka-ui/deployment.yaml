{{- if .Values.kafka.ui.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kafkaui.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: kafka-ui
    {{ include "federator-suite.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: kafka-ui
  template:
    metadata:
      labels:
        app: kafka-ui
    spec:
      restartPolicy: Always
      containers:
      - name: kafka-ui
        image: "{{ .Values.kafka.ui.image.repository }}:{{ .Values.kafka.ui.image.tag }}"
        imagePullPolicy: {{ .Values.kafka.ui.image.pullPolicy | default "IfNotPresent" }}
        ports:
          - name: http
            containerPort: 8080
            protocol: TCP
        env:
        {{ if not .Values.kafka.external }}
        - name: KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS
          value: {{ include "kafka.bootstrapServers" . }}
        - name: KAFKA_CLUSTERS_0_PROPERTIES_SECURITY_PROTOCOL
          value: "SASL_PLAINTEXT"
        - name: KAFKA_CLUSTERS_0_PROPERTIES_SASL_MECHANISM
          value: "SCRAM-SHA-512"
        - name: KAFKA_CLUSTERS_0_PROPERTIES_SASL_JAAS_CONFIG
          valueFrom:
            secretKeyRef:
              name: kafka-user
              key: sasl.jaas.config
        {{ else }}
        - name: KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS
          value: {{ .Values.kafka.externalSettings.bootstrapServers | quote }}
        - name: KAFKA_CLUSTERS_0_PROPERTIES_SECURITY_PROTOCOL
          value: {{ .Values.kafka.externalSettings.securityProtocol | quote }}
        - name: KAFKA_CLUSTERS_0_PROPERTIES_SASL_MECHANISM
          value: {{ .Values.kafka.externalSettings.saslMechanism | quote }}
        - name: KAFKA_CLUSTERS_0_PROPERTIES_SASL_JAAS_CONFIG
          valueFrom:
            secretKeyRef:
              name: federator-runtime-properties
              key: KAFKA_SASL_JAAS_CONFIG
        {{ end }}
        - name: KAFKA_CLUSTERS_0_NAME
          value: {{ .Values.global.orgName | quote }}
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
{{- end }}
