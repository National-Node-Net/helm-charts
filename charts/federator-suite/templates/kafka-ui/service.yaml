{{- if .Values.kafka.ui.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-ui
  namespace: {{ .Release.Namespace }}
  labels:
    app: kafka-ui
    {{ include "federator-suite.labels" . | nindent 4 }}
spec:
  type: {{ .Values.kafka.ui.service.type }}
  ports:
  - port: 8080
    targetPort: http
    protocol: TCP
    name: http
    {{- if and (eq .Values.kafka.ui.service.type "NodePort") .Values.kafka.ui.service.nodePort }}
    nodePort: {{ .Values.kafka.ui.service.nodePort }}
    {{- end }}
  selector:
    app: kafka-ui
{{- end }}
