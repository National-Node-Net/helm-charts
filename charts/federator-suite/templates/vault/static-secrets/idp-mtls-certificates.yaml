{{- if .Values.vault.staticSecrets.enabled }}
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: federator-suite-idp-mtls-certificates
  namespace: {{ .Release.Namespace }}
spec:
  vaultAuthRef: federator-suite-vault-internal
  mount: secret
  path: /apps/client-server
  type: kv-v2
  refreshAfter: 30s
  rolloutRestartTargets:
    - kind: Deployment
      name: {{ include "server.name" . }}
    - kind: Deployment
      name: {{ include "client.name" . }}
  destination:
    name: idp-mtls-certificates
    create: true
    overwrite: true
    labels:
      ndtp.gov.uk/secret-purpose: idp-mtls
    annotations:
      ndtp.gov.uk/keystores: "idp-client-keystore.jks and ndtp-keystore.jks are Keycloak client mTLS identities."
      ndtp.gov.uk/truststore: "keycloak.truststore.jks is the Keycloak truststore."
    transformation:
      excludeRaw: true
      excludes:
        - '.*'
      templates:
        client-keystore.password:
          text: {{ "{{ get .Secrets \"certificates_clientKeystorePassword\" }}" | quote }}
        idp-client-keystore.jks:
          text: {{ "{{ get .Secrets \"certificates_clientKeystoreJks\" | b64dec }}" | quote }}
        keycloak.truststore.jks:
          text: {{ "{{ get .Secrets \"certificates_truststoreJks\" | b64dec }}" | quote }}
        keystore.password:
          text: {{ "{{ get .Secrets \"certificates_serverKeystorePassword\" }}" | quote }}
        ndtp-keystore.jks:
          text: {{ "{{ get .Secrets \"certificates_serverKeystoreJks\" | b64dec }}" | quote }}
        truststore.password:
          text: {{ "{{ get .Secrets \"certificates_truststorePassword\" }}" | quote }}
{{- end }}
