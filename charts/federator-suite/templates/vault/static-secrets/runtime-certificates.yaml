{{- if and .Values.vault.staticSecrets.enabled .Values.certificateManager.enabled }}
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: federator-suite-runtime-certificates
  namespace: {{ .Release.Namespace }}
spec:
  vaultAuthRef: certificate-manager-vault-auth
  mount: node-net
  path: output
  type: kv-v2
  refreshAfter: 30s
  # Restart the federator workloads when certificate-manager renews the bundle.
  rolloutRestartTargets:
    - kind: Deployment
      name: {{ include "server.name" . }}
    - kind: Deployment
      name: {{ include "client.name" . }}
  destination:
    name: federator-runtime-certificates
    create: true
    overwrite: true
    transformation:
      excludeRaw: true
      excludes:
        - '.*'
      templates:
        keystore.p12:
          text: {{ "{{ get .Secrets \"keystore.p12\" | b64dec }}" | quote }}
        keystore.password:
          text: {{ "{{ get .Secrets \"keystore.password\" }}" | quote }}
        truststore.p12:
          text: {{ "{{ get .Secrets \"truststore.p12\" | b64dec }}" | quote }}
        truststore.password:
          text: {{ "{{ get .Secrets \"truststore.password\" }}" | quote }}
{{- end }}
