{{- if .Values.vault.staticSecrets.enabled }}
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: federator-runtime-properties
  namespace: {{ .Release.Namespace }}
spec:
  vaultAuthRef: federator-suite-vault-internal
  mount: secret
  path: /apps/client-server
  type: kv-v2
  refreshAfter: 30s
  rolloutRestartTargets:
    - kind: Deployment
      name: federator-server
    - kind: Deployment
      name: federator-client
  destination:
    name: {{ .Values.federatorClient.runtimeSecret | default "federator-runtime-properties" }}
    create: true
    overwrite: true
    transformation:
      excludeRaw: true
      excludes:
        - '.*'
      templates:
        IDP_CLIENT_ID:
          text: {{ "{{ get .Secrets \"idp_clientId\" }}" | quote }}
        IDP_JWKS_URL:
          text: {{ "{{ get .Secrets \"idp_jwksUrl\" }}" | quote }}
        IDP_TOKEN_URL:
          text: {{ "{{ get .Secrets \"idp_tokenUrl\" }}" | quote }}
        IDP_MTLS_ENABLED:
          text: {{ "{{ get .Secrets \"idp_mtlsEnabled\" }}" | quote }}
        IDP_KEYSTORE_PASSWORD:
          text: {{ "{{ get .Secrets \"idp_keystorePassword\" }}" | quote }}
        IDP_TRUSTSTORE_PASSWORD:
          text: {{ "{{ get .Secrets \"idp_truststorePassword\" }}" | quote }}
{{- if .Values.kafka.external }}
        KAFKA_SASL_JAAS_CONFIG:
          text: {{ "{{ get .Secrets \"kafkaAuth_jaasConfig\" }}" | quote }}
{{- end }}
{{- if .Values.valkey.external }}
        VALKEY_PASSWORD:
          text: {{ "{{ get .Secrets \"valkey_password\" }}" | quote }}
        VALKEY_USERNAME:
          text: {{ "{{ get .Secrets \"valkey_username\" }}" | quote }}
{{- end }}
{{- end }}
