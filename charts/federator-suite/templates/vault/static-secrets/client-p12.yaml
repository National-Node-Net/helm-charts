{{- if .Values.vault.staticSecrets.enabled }}
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: federator-suite-client-p12
  namespace: {{ .Release.Namespace }}
spec:
  vaultAuthRef: federator-suite-vault-internal
  mount: secret
  path: /apps/client-server
  type: kv-v2
  refreshAfter: 30s
  destination:
    name: federation-client-p12
    create: true
    overwrite: true
    rolloutRestartTargets:
      - kind: Deployment
        name: federator-server
      - kind: Deployment
        name: federator-client
    transformation:
      excludeRaw: true
      excludes:
        - '.*'
      templates:
        client-org1.p12:
          text: {{ "{{ get .Secrets \"certificates_clientP12\" | b64dec }}" | quote }}
        client.p12.password:
          text: {{ "{{ get .Secrets \"certificates_clientP12Password\" }}" | quote }}
{{- end }}
