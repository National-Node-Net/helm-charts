{{- if .Values.vault.staticSecrets.enabled }}
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: federator-suite-server-p12
  namespace: {{ .Release.Namespace }}
spec:
  vaultAuthRef: federator-suite-vault-internal
  mount: secret
  path: /apps/client-server
  type: kv-v2
  refreshAfter: 30s
  rolloutRestartTargets:
    - kind: Deployment
      name: federator-server
    - kind: Deployment
      name: federator-client
  destination:
    name: federation-server-p12
    create: true
    overwrite: true
    transformation:
      excludeRaw: true
      excludes:
        - '.*'
      templates:
        dev-ndtp.p12:
          text: {{ "{{ get .Secrets \"certificates_serverP12\" | b64dec }}" | quote }}
        server.p12.password:
          text: {{ "{{ get .Secrets \"certificates_serverP12Password\" }}" | quote }}
{{- end }}
