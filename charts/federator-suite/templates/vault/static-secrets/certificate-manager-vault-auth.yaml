{{- if and .Values.vault.staticSecrets.enabled .Values.certificateManager.enabled }}
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: certificate-manager-vault-auth
  namespace: {{ .Release.Namespace }}
spec:
  vaultConnectionRef: federator-suite-vault-internal
  method: kubernetes
  mount: kubernetes
  kubernetes:
    # This role is provisioned by vault-setup with the certificate-manager policy.
    role: certificate-manager
    serviceAccount: {{ include "certificateManager.serviceAccountName" . }}
    audiences:
      - vault
{{- end }}
