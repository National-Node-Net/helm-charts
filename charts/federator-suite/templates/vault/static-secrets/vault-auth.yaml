{{- if .Values.vault.staticSecrets.enabled }}
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: federator-suite-vault-internal
  namespace: {{ .Release.Namespace }}
spec:
  vaultConnectionRef: federator-suite-vault-internal
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: client-server-vault-reader-role
    serviceAccount: federator-suite-vault-internal
    audiences:
      - vault
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: certificate-manager-vault-auth
  namespace: {{ .Release.Namespace }}
spec:
  vaultConnectionRef: federator-suite-vault-internal
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: certificate-manager-role
    serviceAccount: {{ include "certificateManager.serviceAccountName" . }}
    # The certificate-manager application supplies the Kubernetes JWT (audience) itself.
{{- end }}
