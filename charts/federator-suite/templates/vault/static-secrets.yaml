{{/*
Vault Secrets Operator creates the Kubernetes Secrets below from
/apps/client-server. Populate that Vault path manually after Vault
is running. Configure the federator-suite-client-server-vault-reader role to grant access
to that path. These Secrets are consumed by federator-server and federator-client.
*/}}
{{- if .Values.vault.staticSecrets.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: federator-suite-client-server-vault-auth
  namespace: {{ .Release.Namespace }}
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultConnection
metadata:
  name: federator-suite-client-server-vault-connection
  namespace: {{ .Release.Namespace }}
spec:
  address: {{ printf "http://%s-vault-active.%s.svc.cluster.local:8200" .Release.Name .Release.Namespace | quote }}
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: federator-suite-client-server-vault-auth
  namespace: {{ .Release.Namespace }}
spec:
  vaultConnectionRef: federator-suite-client-server-vault-connection
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: federator-suite-client-server-vault-reader
    serviceAccount: federator-suite-client-server-vault-auth
    audiences:
      - vault
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: federator-suite-federation-cert
  namespace: {{ .Release.Namespace }}
spec:
  vaultAuthRef: federator-suite-client-server-vault-auth
  mount: secret
  path: /apps/client-server
  type: kv-v2
  refreshAfter: 30s
  destination:
    name: federation-cert
    create: true
    overwrite: true
    rolloutRestartTargets:
      - kind: Deployment
        name: federator-server
      - kind: Deployment
        name: federator-client
    transformation:
      excludeRaw: true
      excludes:
        - '.*'
      templates:
        keycloak.truststore.jks:
          text: {{ "{{ get .Secrets \"certificates_truststoreJks\" | b64dec }}" | quote }}
        truststore.password:
          text: {{ "{{ get .Secrets \"certificates_truststorePassword\" }}" | quote }}
        ndtp-keystore.jks:
          text: {{ "{{ get .Secrets \"certificates_serverKeystoreJks\" | b64dec }}" | quote }}
        keystore.password:
          text: {{ "{{ get .Secrets \"certificates_serverKeystorePassword\" }}" | quote }}
        client-org1-keystore.jks:
          text: {{ "{{ get .Secrets \"certificates_clientKeystoreJks\" | b64dec }}" | quote }}
        client-keystore.password:
          text: {{ "{{ get .Secrets \"certificates_clientKeystorePassword\" }}" | quote }}
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: federator-suite-client-p12
  namespace: {{ .Release.Namespace }}
spec:
  vaultAuthRef: federator-suite-client-server-vault-auth
  mount: secret
  path: /apps/client-server
  type: kv-v2
  refreshAfter: 30s
  destination:
    name: federation-client-p12
    create: true
    overwrite: true
    rolloutRestartTargets:
      - kind: Deployment
        name: federator-server
      - kind: Deployment
        name: federator-client
    transformation:
      excludeRaw: true
      excludes:
        - '.*'
      templates:
        client-org1.p12:
          text: {{ "{{ get .Secrets \"certificates_clientP12\" | b64dec }}" | quote }}
        client.p12.password:
          text: {{ "{{ get .Secrets \"certificates_clientP12Password\" }}" | quote }}
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: federator-suite-server-p12
  namespace: {{ .Release.Namespace }}
spec:
  vaultAuthRef: federator-suite-client-server-vault-auth
  mount: secret
  path: /apps/client-server
  type: kv-v2
  refreshAfter: 30s
  destination:
    name: federation-server-p12
    create: true
    overwrite: true
    rolloutRestartTargets:
      - kind: Deployment
        name: federator-server
      - kind: Deployment
        name: federator-client
    transformation:
      excludeRaw: true
      excludes:
        - '.*'
      templates:
        dev-ndtp.p12:
          text: {{ "{{ get .Secrets \"certificates_serverP12\" | b64dec }}" | quote }}
        server.p12.password:
          text: {{ "{{ get .Secrets \"certificates_serverP12Password\" }}" | quote }}
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: federator-suite-kafka-auth
  namespace: {{ .Release.Namespace }}
spec:
  vaultAuthRef: federator-suite-client-server-vault-auth
  mount: secret
  path: /apps/client-server
  type: kv-v2
  refreshAfter: 30s
  destination:
    name: kafka-auth-config
    create: true
    overwrite: true
    rolloutRestartTargets:
      - kind: Deployment
        name: federator-server
      - kind: Deployment
        name: federator-client
    transformation:
      excludeRaw: true
      excludes:
        - '.*'
      templates:
        kafka-auth.properties:
          text: |
            kafka.additional.security.protocol={{ "{{ get .Secrets \"kafkaAuth_securityProtocol\" }}" }}
            kafka.additional.sasl.mechanism={{ "{{ get .Secrets \"kafkaAuth_saslMechanism\" }}" }}
            kafka.additional.sasl.jaas.config={{ "{{ get .Secrets \"kafkaAuth_jaasConfig\" }}" }}
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: federator-runtime-secret
  namespace: {{ .Release.Namespace }}
spec:
  vaultAuthRef: federator-suite-client-server-vault-auth
  mount: secret
  path: /apps/client-server
  type: kv-v2
  refreshAfter: 30s
  destination:
    name: federator-runtime-secret
    create: true
    overwrite: true
    rolloutRestartTargets:
      - kind: Deployment
        name: federator-server
      - kind: Deployment
        name: federator-client
    transformation:
      excludeRaw: true
      excludes:
        - '.*'
      templates:
        IDP_CLIENT_ID:
          text: {{ "{{ get .Secrets \"idp_clientId\" }}" | quote }}
        IDP_JWKS_URL:
          text: {{ "{{ get .Secrets \"idp_jwksUrl\" }}" | quote }}
        IDP_TOKEN_URL:
          text: {{ "{{ get .Secrets \"idp_tokenUrl\" }}" | quote }}
        IDP_KEYSTORE_PATH:
          text: {{ "{{ get .Secrets \"idp_keystorePath\" }}" | quote }}
        IDP_MTLS_ENABLED:
          text: {{ "{{ get .Secrets \"idp_mtlsEnabled\" }}" | quote }}
        IDP_KEYSTORE_PASSWORD:
          text: {{ "{{ get .Secrets \"idp_keystorePassword\" }}" | quote }}
        IDP_TRUSTSTORE_PASSWORD:
          text: {{ "{{ get .Secrets \"idp_truststorePassword\" }}" | quote }}
        KAFKA_SASL_JAAS_CONFIG:
          text: {{ "{{ get .Secrets \"kafkaAuth_jaasConfig\" }}" | quote }}
        SERVER_P12_FILENAME:
          text: {{ "{{ get .Secrets \"certificates_serverP12Filename\" }}" | quote }}
        SERVER_P12_PASSWORD:
          text: {{ "{{ get .Secrets \"certificates_serverP12Password\" }}" | quote }}
        SERVER_KEYSTORE_PASSWORD:
          text: {{ "{{ get .Secrets \"certificates_serverKeystorePassword\" }}" | quote }}
        CLIENT_P12_FILENAME:
          text: {{ "{{ get .Secrets \"certificates_clientP12Filename\" }}" | quote }}
        CLIENT_P12_PASSWORD:
          text: {{ "{{ get .Secrets \"certificates_clientP12Password\" }}" | quote }}
        CLIENT_KEYSTORE_PASSWORD:
          text: {{ "{{ get .Secrets \"certificates_clientKeystorePassword\" }}" | quote }}
        TRUSTSTORE_PASSWORD:
          text: {{ "{{ get .Secrets \"certificates_truststorePassword\" }}" | quote }}
        VALKEY_USERNAME:
          text: {{ "{{ get .Secrets \"valkey_username\" }}" | quote }}
        VALKEY_PASSWORD:
          text: {{ "{{ get .Secrets \"valkey_password\" }}" | quote }}
{{- end }}
