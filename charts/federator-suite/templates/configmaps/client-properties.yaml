{{- if .Values.federatorClient.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name:  {{ include "client.name" . }}-properties
  namespace: {{ .Release.Namespace }}
  labels:
    {{ include "federator-suite.client.labels" . | nindent 4 }}
# Certificate use has two connections:
# Connection 1: federator gRPC uses the certificate-manager runtime PKCS#12 bundle.
# Connection 2: Keycloak and Management Node HTTPS use that same runtime identity;
#               the IdP truststore verifies Keycloak's HTTPS server certificate
#               (the Amazon CA chain in dev).
data:
  client.properties: |-
    # Identity Provider (IDP) Configuration
    idp.client.id={{ .Values.federatorClient.config.idpClientId }}
    idp.jwks.url={{ .Values.federatorClient.config.idpJwksUrl }}
    idp.token.url={{ .Values.federatorClient.config.idpTokenUrl }}
    
    # Certificate-manager-issued identity for both Keycloak and Management Node mTLS.
    idp.keystore.path=/secrets/federator-runtime-certificates/keystore.p12
    idp.truststore.path=/secrets/federator-runtime-certificates/truststore.p12
    idp.mtls.enabled={{ .Values.federatorClient.config.idpMtlsEnabled | default true }}
    idp.keystore.password=${RUNTIME_KEYSTORE_PASSWORD}
    idp.truststore.password=${RUNTIME_TRUSTSTORE_PASSWORD}

    # Kafka Configuration (Sender)
    kafka.additional.allow.auto.create.topics={{ .Values.federatorClient.config.kafkaAllowAutoCreateTopics | default false }}
    kafka.consumerGroup={{ .Values.federatorClient.config.kafkaConsumerGroup | default (printf "ndtp.dbt.gov.uk.%s" (.Values.global.orgName | lower)) }}
    kafka.sender.defaultKeySerializerClass=org.apache.kafka.common.serialization.BytesSerializer
    kafka.sender.defaultValueSerializerClass=org.apache.kafka.common.serialization.BytesSerializer
    kafka.topic.prefix={{ .Values.federatorClient.config.kafkaTopicPrefix | default (printf "Deprecated%s" (.Values.global.orgName | upper)) }}

{{ if not .Values.kafka.external }}
    # Internal Kafka Bootstrap Servers
    kafka.bootstrapServers={{ include "kafka.bootstrapServers" . }}
    kafka.additional.sasl.jaas.config=${KAFKA_SASL_JAAS_CONFIG}
    kafka.additional.security.protocol=SASL_PLAINTEXT
    kafka.additional.sasl.mechanism=SCRAM-SHA-512
{{- else }}
    # External Kafka Bootstrap Servers
    kafka.bootstrapServers={{ include "kafka.bootstrapServers" . }}
    kafka.additional.sasl.jaas.config=${KAFKA_SASL_JAAS_CONFIG}
    kafka.additional.security.protocol={{ .Values.kafka.externalSettings.securityProtocol | default "SASL_PLAINTEXT" }}
    kafka.additional.sasl.mechanism={{ .Values.kafka.externalSettings.saslMechanism | default "SCRAM-SHA-512" }}
{{- end }}  
   
{{ if not .Values.valkey.external }}
    # Internal Redis/Valkey Configuration
    redis.host={{ include "valkey.hostname" . }}
    redis.port={{ .Values.valkey.valkey.service.port }}
    redis.tls.enabled=false
    redis.prefix={{ .Values.federatorClient.config.redisPrefix }}
    redis.username=${VALKEY_USERNAME}
    redis.password=${VALKEY_PASSWORD}
    redis.aes.key=
{{- else }}
    # External Redis/Valkey Configuration
    redis.host={{ include "valkey.hostname" . }}
    redis.port={{ .Values.valkey.externalSettings.port }}
    redis.tls.enabled={{ .Values.valkey.externalSettings.tlsEnabled | default false }}
    redis.prefix={{ .Values.federatorClient.config.redisPrefix }}
    redis.username=${VALKEY_USERNAME}
    redis.password=${VALKEY_PASSWORD}
    redis.aes.key=
{{- end}}

    # JobRunr Configuration
    org.jobrunr.jobs.default-allow-concurrent-execution=false
    jobs.dashboard.port=8085
    jobs.dashboard.enabled=true

    # Management Node
    management.node.cache.ttl.seconds=60
    management.node.request.timeout=60
    management.node.base.url={{ .Values.global.managementNode.baseUrl }}

    # Client TLS Configuration
    client.mtlsEnabled={{ .Values.federatorClient.config.mtlsEnabled | default true }}
    client.tlsEnabled={{ .Values.federatorClient.config.tlsEnabled | default true }}
    client.p12FilePath=/secrets/federator-runtime-certificates/keystore.p12
    client.p12Password=${RUNTIME_KEYSTORE_PASSWORD}
    client.truststoreFilePath=/secrets/federator-runtime-certificates/truststore.p12
    client.truststorePassword=${RUNTIME_TRUSTSTORE_PASSWORD}

    # File Storage Configuration
    {{- include "storage" . | nindent 4 }}
{{- end }}
