{{- if .Values.certificateManager.enabled }}
{{- $certDestPath := .Values.certificateManager.config.cert.destPath | default "/certs" | trimSuffix "/" }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "federator-suite.certificateManager.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{ include "federator-suite.labels" . | nindent 4 }}
    app.kubernetes.io/component: certificate-manager
    app: certificate-manager
spec:
  replicas: {{ .Values.certificateManager.replicaCount | default 1 }}
  # This singleton mounts an RWO certificate PVC. Recreate releases the old pod
  # before starting its replacement, avoiding a rollout deadlock on zone-bound storage.
  strategy:
    type: Recreate
    rollingUpdate: null
  selector:
    matchLabels:
      app: certificate-manager
      {{ include "federator-suite.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- include "federator-suite.istio.inject" . | nindent 8 }}
        {{- with .Values.certificateManager.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        app: certificate-manager
        {{ include "federator-suite.labels" . | nindent 8 }}
        app.kubernetes.io/component: certificate-manager
    spec:
      serviceAccountName: {{ include "federator-suite.certificateManager.serviceAccountName" . }}
      restartPolicy: Always
      {{- with .Values.certificateManager.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.certificateManager.podSecurityContext | nindent 8 }}
      {{- if .Values.certificateManager.vaultToken.useSecret }}
      initContainers:
      - name: wait-for-vault-token
        image: bitnami/kubectl:latest
        imagePullPolicy: IfNotPresent
        # Block until the vault-token secret exists — prevents Spring Cloud Vault failing
        # at startup with "spring.cloud.vault.token is empty". In local mode, the
        # vault-setup sidecar creates this secret after first-time Vault init.
        command:
        - /bin/sh
        - -c
        - |
          SECRET={{ include "federator-suite.certificateManager.fullname" . }}-vault-token
          echo "Waiting for secret $SECRET to exist..."
          until kubectl get secret "$SECRET" -n {{ .Release.Namespace }} > /dev/null 2>&1; do
            echo "  secret not found yet, retrying in 5s..."
            sleep 5
          done
          echo "  ✓ Secret $SECRET exists, starting cert-manager"
      {{- end }}
      containers:
      - name: certificate-manager
        image: "{{ .Values.certificateManager.image.repository }}:{{ .Values.certificateManager.image.tag }}"
        imagePullPolicy: {{ .Values.certificateManager.image.pullPolicy | default "IfNotPresent" }}
        env:
        # Vault configuration
        - name: VAULT_ADDR
          value: {{ include "federator-suite.vault.addr" . }}
        # Spring Cloud Vault uses VAULT_URI (application.yml: uri: ${VAULT_URI:http://localhost:8200})
        - name: VAULT_URI
          value: {{ include "federator-suite.vault.addr" . }}
        # KV v2 mount name (application.vault.pki-mount) — DEAD/unused property, kept only
        # for forward-compatibility (see values/certificate-manager.yaml comment). The real
        # mount is the first "/"-delimited segment of VAULT_SECRET_PATH below.
        - name: VAULT_PKI_MOUNT
          value: {{ .Values.certificateManager.config.vault.pkiMount | default "node-net" | quote }}
        - name: VAULT_SECRET_PATH
          value: {{ .Values.certificateManager.config.vault.secretPath | default "node-net/client" | quote }}
        {{- if .Values.certificateManager.vaultToken.useSecret }}
        # TOKEN auth: inject vault token from k8s Secret (created by vault-setup sidecar in local mode)
        # Init container above guarantees this secret exists before this container starts.
        - name: VAULT_TOKEN
          valueFrom:
            secretKeyRef:
              name: {{ include "federator-suite.certificateManager.fullname" . }}-vault-token
              key: vault-token
        {{- end }}
        # Vault authentication method — drives Spring Cloud Vault strategy
        # TOKEN: uses VAULT_TOKEN env var (local/Shamir); KUBERNETES: uses SA JWT (cloud)
        # Corresponds to application.yml: authentication: ${VAULT_AUTHENTICATION:token}
        - name: VAULT_AUTHENTICATION
          value: {{ .Values.certificateManager.config.vault.authentication | default "TOKEN" | upper | quote }}
        - name: VAULT_AUTH_ROLE
          value: {{ .Values.certificateManager.config.vault.authRole | default "certificate-manager" | quote }}
        # Management Node configuration
        - name: MANAGEMENT_NODE_BASE_URL
          value: {{ .Values.certificateManager.config.managementNode.baseUrl | default .Values.global.managementNode.baseUrl | quote }}
        # OAuth2 configuration — always required by the app (no enable/disable toggle exists),
        # so these are set unconditionally and the render fails loudly if left unset rather than
        # silently falling back to the app's dev-placeholder https://localhost:8443/... default.
        - name: OAUTH2_TOKEN_URI
          value: {{ required "certificateManager.config.oauth2.tokenUri is required" .Values.certificateManager.config.oauth2.tokenUri | quote }}
        - name: OAUTH2_CLIENT_ID
          value: {{ required "certificateManager.config.oauth2.clientId is required" .Values.certificateManager.config.oauth2.clientId | quote }}
        # mTLS client identity for calling the IdP / Management Node (application.client.*).
        # Per the app README ("Local Development with Management Node") and
        # MtlsHttpClientBuilder, this IS the cert-manager's OWN Vault-synced output
        # keystore.p12/truststore.p12 written by CertificateSyncJob into CERT_DEST_PATH.
        # Passwords are intentionally NOT set: the app resolves them from Vault
        # (<secretPath>/keystore-password|truststore-password, generated by the sync job)
        # before ever consulting MTLS_*_PASSWORD, so a static password here would be wrong
        # once the sync job has run. Until an operator seeds Vault with bootstrap material
        # the renewal job logs errors (no keystore yet) but the process stays up.
        - name: MTLS_KEYSTORE_PATH
          value: {{ .Values.certificateManager.config.mtls.keystorePath | default (printf "%s/%s" $certDestPath (.Values.certificateManager.config.cert.destKeystoreFile | default "keystore.p12")) | quote }}
        - name: MTLS_TRUSTSTORE_PATH
          value: {{ .Values.certificateManager.config.mtls.truststorePath | default (printf "%s/%s" $certDestPath (.Values.certificateManager.config.cert.destTruststoreFile | default "truststore.p12")) | quote }}
        - name: MTLS_KEYSTORE_TYPE
          value: {{ .Values.certificateManager.config.mtls.keystoreType | default "PKCS12" | quote }}
        # Certificate configuration (application.certificate.*)
        - name: CERT_DEST_PATH
          value: {{ $certDestPath | quote }}
        - name: CERT_RENEWAL_RATE
          value: {{ .Values.certificateManager.config.cert.renewalRate | default "3600000" | quote }}
        - name: CERT_SYNC_RATE
          value: {{ .Values.certificateManager.config.cert.syncRate | default "60000" | quote }}
        - name: CERT_RENEWAL_THRESHOLD
          value: {{ .Values.certificateManager.config.cert.renewalThresholdPercentage | default "10" | quote }}
        - name: CERT_KEY_SIZE
          value: {{ .Values.certificateManager.config.cert.keySize | default "2048" | quote }}
        - name: CERT_INTERMEDIATE_MIN_VALID_DAYS
          value: {{ .Values.certificateManager.config.cert.intermediateMinValidDays | default "14" | quote }}
        - name: CERT_DEST_KEYSTORE_ALIAS
          value: {{ .Values.certificateManager.config.cert.destKeystoreAlias | default "federator" | quote }}
        {{- if .Values.certificateManager.config.cert.subjectOrg }}
        - name: CERT_SUBJECT_ORG
          value: {{ .Values.certificateManager.config.cert.subjectOrg | quote }}
        {{- end }}
        {{- if .Values.certificateManager.config.cert.subjectCountry }}
        - name: CERT_SUBJECT_COUNTRY
          value: {{ .Values.certificateManager.config.cert.subjectCountry | quote }}
        {{- end }}
        {{- if .Values.certificateManager.config.cert.subjectState }}
        - name: CERT_SUBJECT_STATE
          value: {{ .Values.certificateManager.config.cert.subjectState | quote }}
        {{- end }}
        {{- if .Values.certificateManager.config.cert.subjectLocality }}
        - name: CERT_SUBJECT_LOCALITY
          value: {{ .Values.certificateManager.config.cert.subjectLocality | quote }}
        {{- end }}
        {{- if .Values.certificateManager.config.cert.subjectOu }}
        - name: CERT_SUBJECT_OU
          value: {{ .Values.certificateManager.config.cert.subjectOu | quote }}
        {{- end }}
        # Required — app defaults to the meaningless ACME placeholder CN/SAN if unset (§3.1 gap analysis)
        - name: CERT_SUBJECT_CN
          value: {{ required "certificateManager.config.cert.subjectCn is required" .Values.certificateManager.config.cert.subjectCn | quote }}
        - name: CERT_SUBJECT_ALT_NAMES
          value: {{ required "certificateManager.config.cert.subjectAltNames is required" .Values.certificateManager.config.cert.subjectAltNames | quote }}
        # Spring Boot configuration
        - name: SPRING_MAIN_WEB_APPLICATION_TYPE
          value: "none"
        - name: LOG_LEVEL_APP
          value: {{ .Values.certificateManager.config.appLogLevel | default "INFO" | quote }}
        - name: LOG_LEVEL_SPRING_SECURITY
          value: {{ .Values.certificateManager.config.springSecurityLogLevel | default "INFO" | quote }}
        # Exec probes for headless scheduler (no HTTP port)
        livenessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - pgrep -f 'app.jar' > /dev/null
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - pgrep -f 'app.jar' > /dev/null
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          {{- toYaml .Values.certificateManager.resources | nindent 10 }}
        volumeMounts:
        - name: cert-storage
          mountPath: {{ $certDestPath }}
        {{- if .Values.certificateManager.bootstrapCert.enabled }}
        - name: bootstrap-cert
          mountPath: /bootstrap-certs
          readOnly: true
        {{- end }}
        securityContext:
          {{- toYaml .Values.certificateManager.securityContext | nindent 10 }}
      volumes:
      - name: cert-storage
        persistentVolumeClaim:
          claimName: {{ include "federator-suite.certStorage.claimName" . }}
      {{- if .Values.certificateManager.bootstrapCert.enabled }}
      - name: bootstrap-cert
        secret:
          secretName: {{ .Values.certificateManager.bootstrapCert.secretName | default (printf "%s-bootstrap-cert" (include "federator-suite.certificateManager.fullname" .)) }}
      {{- end }}
      {{- with .Values.certificateManager.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.certificateManager.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.certificateManager.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}

