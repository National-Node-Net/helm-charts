name: ci on pull request

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    branches:
      - develop
    paths:
      - 'charts/federator-suite-vault-init/**'
      - '.github/workflows/ci-pr.yml'
      - '!**.md'

permissions:
  contents: read

jobs:
  vault-init-unit-tests:
    name: vault-init unit tests
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: 0.9.17

      - name: install python dependencies with uv
        working-directory: charts/federator-suite-vault-init
        run: |
          uv venv .venv --python 3.13
          uv pip install --python .venv/bin/python -r vault-init/requirements.debug.txt

      - name: run vault-init unit tests
        working-directory: charts/federator-suite-vault-init
        run: ./scripts/run-tests.sh

  vault-init-image-scan:
    name: vault-init image scan
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            suffix: amd64
          - platform: linux/arm64
            suffix: arm64
    steps:
      - name: check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: build vault-init runtime image
        working-directory: charts/federator-suite-vault-init
        run: docker buildx build --platform ${{ matrix.platform }} --load --no-cache --target runtime --tag vault-init:ci-${{ matrix.suffix }} .

      - name: scan vault-init image with trivy
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: vault-init:ci-${{ matrix.suffix }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          vuln-type: os,library
