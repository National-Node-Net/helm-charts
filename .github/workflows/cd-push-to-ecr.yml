name: Build and push image to ECR

on:
  workflow_call:
    inputs:
      aws_account_number:
        description: AWS account that owns the ECR repository
        required: true
        type: string
      repo_name:
        description: ECR repository name
        required: true
        type: string
      version:
        description: Image version tag
        required: true
        type: string
      jar_name:
        description: Maven JAR artifact name without its version
        required: true
        type: string
      dockerfile:
        description: Dockerfile used to build the image
        required: true
        type: string
  workflow_dispatch:
    inputs:
      aws_account_number:
        description: AWS account that owns the ECR repository
        required: true
        type: string
      repo_name:
        description: ECR repository name
        required: true
        type: string
      version:
        description: Image version tag
        required: true
        type: string
      jar_name:
        description: Maven JAR artifact name without its version
        required: true
        type: string
      dockerfile:
        description: Dockerfile used to build the image
        required: true
        type: string

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: eu-west-2
  MAVEN_CLI_OPTS: "--batch-mode --no-transfer-progress"

jobs:
  docker-build-push:
    name: Build and push image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: "21"
          distribution: temurin
          cache: maven
          server-password: GH_PACKAGES_PAT
      - name: Get project version
        id: get-version
        run: echo "project_version=$(./mvnw $MAVEN_CLI_OPTS help:evaluate -Dexpression=project.version -q -DforceStdout)" >> "$GITHUB_OUTPUT"
      - name: Build application JARs
        env:
          GH_PACKAGES_PAT: ${{ secrets.GH_PACKAGES_PAT }}
        run: ./mvnw $MAVEN_CLI_OPTS package -DskipTests
      - name: Build Docker image
        env:
          ECR_REGISTRY: ${{ inputs.aws_account_number }}.dkr.ecr.eu-west-2.amazonaws.com
          REPO_NAME: ${{ inputs.repo_name }}
          VERSION: ${{ inputs.version }}
          JAR_NAME: ${{ inputs.jar_name }}
          DOCKERFILE: ${{ inputs.dockerfile }}
        run: |
          docker build --no-cache \
            --build-arg JAR_NAME="$JAR_NAME-${{ steps.get-version.outputs.project_version }}" \
            -t "$ECR_REGISTRY/$REPO_NAME:${{ github.sha }}" \
            -t "$ECR_REGISTRY/$REPO_NAME:$VERSION" \
            -f "$DOCKERFILE" --target federator .
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ inputs.aws_account_number }}:role/ecr-access-for-github
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: githubsession
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
      - name: Push Docker image
        env:
          ECR_REGISTRY: ${{ inputs.aws_account_number }}.dkr.ecr.eu-west-2.amazonaws.com
          REPO_NAME: ${{ inputs.repo_name }}
        run: docker image push --all-tags "$ECR_REGISTRY/$REPO_NAME"
      - name: Verify pushed image
        env:
          REPO_NAME: ${{ inputs.repo_name }}
        run: aws ecr describe-images --repository-name "$REPO_NAME" --query 'sort_by(imageDetails, &imagePushedAt)[-1]' --output table >> "$GITHUB_STEP_SUMMARY"
